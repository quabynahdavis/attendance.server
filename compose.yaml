services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports:
      - "5432:5432"
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://attendance:attendance@db:5432/attendance?sslmode=disable
      ATTENDANCE_URL: http://localhost:8080
      ATTENDANCE_ADMIN_TOKEN: dev-admin-token
    depends_on:
      - db
